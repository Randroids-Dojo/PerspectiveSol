<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Perspective Sol renderer harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0c1622;
        font: 12px/1.4 ui-monospace, monospace;
        color: #e8f0f0;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #info {
        position: fixed;
        left: 8px;
        bottom: 8px;
        background: #0008;
        padding: 6px 8px;
        border-radius: 4px;
        white-space: pre;
        pointer-events: none;
      }
      #info.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <canvas id="world-2d"></canvas>
    <div id="info"></div>
    <script type="module" src="/harness/harness.ts"></script>
  </body>
</html>
